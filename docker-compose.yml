version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: mahugnon-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2025
      POSTGRES_DB: mahugnon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis (Taux de change & sessions optionnel)
  redis:
    image: redis:7-alpine
    container_name: mahugnon-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Application Web Next.js MAHUGNON
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahugnon-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword2025@postgres:5432/mahugnon?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=mahugnon_super_secret_jwt_key_2025_benin_ecommerce_auth
      - ADMIN_EMAIL=admin@mahugnon.bj
      - ADMIN_PASSWORD_HASH=$2b$10$w8L0QnNrvFwQx1mP2dGbIeYkG3S0jF2s7c6f0YkG3S0jF2s7c6f0Y
      - ADMIN_WHATSAPP_NUMBER=+22997000000
      - DEFAULT_CURRENCY=XOF
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
